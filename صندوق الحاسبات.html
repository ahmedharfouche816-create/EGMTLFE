<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صندوق الحاسبات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1b1b1b;--mut:#6b6b6b;--bd:#e4e4df;--ac:#0f766e;--acx:#fff;--soft:#e6f4f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141516;--card:#1d1f21;--tx:#ececec;--mut:#9a9a9a;--bd:#2d3033;--ac:#2dd4bf;--acx:#06201c;--soft:#12302c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141516;--card:#1d1f21;--tx:#ececec;--mut:#9a9a9a;--bd:#2d3033;--ac:#2dd4bf;--acx:#06201c;--soft:#12302c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Tajawal",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:1.6rem;margin:0;flex:1}
input,textarea,select,button{font:inherit;color:inherit}
.search{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
h2{font-size:1.15rem;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{text-align:right;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer}
.card:hover{border-color:var(--ac)}
.card b{display:block;margin-bottom:2px}
.card span{color:var(--mut);font-size:.88rem}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
.back{border:0;background:var(--soft);color:var(--ac);padding:6px 14px;border-radius:999px;cursor:pointer;margin-bottom:14px}
.panel h3{margin:0 0 4px;font-size:1.3rem}
.panel p{margin:0 0 14px;color:var(--mut)}
label{display:block;font-weight:500;margin:10px 0 4px}
.panel input,.panel textarea,.panel select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
textarea{min-height:120px;resize:vertical}
.go{margin-top:12px;background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:10px 20px;cursor:pointer;font-weight:700}
.out{margin-top:16px;background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;min-height:48px;direction:auto;text-align:start}
.out.err{color:#dc2626}
.copy{margin-top:8px;border:1px solid var(--bd);background:transparent;border-radius:8px;padding:4px 12px;cursor:pointer}
.cdisp{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:16px;direction:ltr;text-align:right;font-size:1.8rem;min-height:68px;overflow-x:auto;word-break:break-all}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;direction:ltr}
.ckeys button{padding:16px 0;font-size:1.25rem;border:1px solid var(--bd);border-radius:12px;background:var(--bg);cursor:pointer}
.ckeys .op{background:var(--soft);color:var(--ac)}
.ckeys .eq{grid-column:span 4;background:var(--ac);color:var(--acx);border:0;font-weight:700}
.dsel{display:flex;gap:8px}
.dsel select{flex:1;min-width:0}
.empty{color:var(--mut);padding:20px 0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🧮 صندوق الحاسبات</h1></header>
  <div id="view"></div>
</div>

<script>
/* ======================================================
   لإضافة حاسبة جديدة: أضف كائناً داخل مصفوفة tools في القسم المناسب.
   id: معرّف بالإنجليزية (حروف وأرقام وشرطة)
   inputs: الحقول  → type: text | number | textarea | select | date
   run(v): تستقبل قيم الحقول (v.id) وتُرجع النص الناتج
   action: إن وُجد، تعمل الأداة عند الضغط على الزر بدل التحديث الفوري
   لإضافة قسم جديد: أضف كائناً جديداً في SECTIONS.
   ====================================================== */

const CAT={len:'طول',mass:'وزن',area:'مساحة',vol:'حجم',speed:'سرعة',data:'بيانات',temp:'حرارة',time:'وقت',pres:'ضغط',energy:'طاقة',torque:'عزم'};
const UN=[['len','m','متر',1],['len','km','كيلومتر',1000],['len','cm','سنتيمتر',.01],['len','mm','مليمتر',.001],['len','mi','ميل',1609.344],['len','ft','قدم',.3048],['len','in','بوصة',.0254],['len','yd','ياردة',.9144],
['mass','kg','كيلوغرام',1],['mass','g','غرام',.001],['mass','lb','رطل',.45359237],['mass','oz','أونصة',.028349523],['mass','ton','طن',1000],
['area','m2','متر مربع',1],['area','km2','كيلومتر مربع',1e6],['area','ha','هكتار',1e4],['area','ft2','قدم مربع',.09290304],['area','acre','فدان أمريكي',4046.8564],
['vol','l','لتر',1],['vol','ml','مليلتر',.001],['vol','gal','غالون أمريكي',3.785411784],['vol','cup','كوب',.2365882365],
['speed','ms','متر/ثانية',1],['speed','kmh','كم/ساعة',1/3.6],['speed','mph','ميل/ساعة',.44704],
['data','B','بايت',1],['data','KB','كيلوبايت',1024],['data','MB','ميغابايت',1048576],['data','GB','غيغابايت',1073741824],['data','TB','تيرابايت',1099511627776],
['len','px','بكسل (96dpi)',.0254/96],['vol','tbsp','ملعقة كبيرة',.01478676478],['vol','tsp','ملعقة صغيرة',.00492892159],['vol','floz','أونصة سائلة',.0295735296],['time','s','ثانية',1],['time','min','دقيقة',60],['time','h','ساعة',3600],['time','d','يوم',86400],['time','wk','أسبوع',604800],['time','yr','سنة',31557600],['pres','pa','باسكال',1],['pres','kpa','كيلوباسكال',1000],['pres','bar','بار',1e5],['pres','psi','PSI',6894.757],['pres','atm','ضغط جوي',101325],['energy','j','جول',1],['energy','kj','كيلوجول',1000],['energy','cal','سعرة صغيرة',4.184],['energy','kcal','سعرة كبيرة (كيلو)',4184],['energy','kwh','كيلوواط ساعة',3.6e6],['energy','ftlb','قدم-باوند',1.3558179],['torque','nm','نيوتن متر',1],['torque','ftlbt','قدم-باوند (عزم)',1.3558179],['temp','c','مئوية'],['temp','f','فهرنهايت'],['temp','k','كلفن']];
const fmt=(x,d=2)=>(+x.toFixed(d)).toLocaleString('en',{maximumFractionDigits:d});
const ok=(...a)=>a.every(x=>x!==''&&x!=null&&!isNaN(+x));
const N=(id,label,value)=>value===undefined?{id,label,type:'number'}:{id,label,type:'number',value};
const SEL=(id,label,options,value)=>({id,label,type:'select',options,value});
const hm=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return (h?h+' ساعة و ':'')+m+' دقيقة'+(sec<120?' ('+sec+' ثانية)':'');};
const SECTIONS = [
{ id:'fin', name:'الحاسبات المالية', tools:[
  { id:'discount', name:'حاسبة الخصم', desc:'السعر بعد الخصم',
    inputs:[{id:'p',label:'السعر',type:'number'},{id:'d',label:'نسبة الخصم %',type:'number'}],
    run:v=>{const p=+v.p,d=+v.d;if(v.p===''||v.d==='')return '';
      return `قيمة الخصم: ${(p*d/100).toFixed(2)}\nالسعر النهائي: ${(p-p*d/100).toFixed(2)}`;} },
  { id:'loan', name:'حاسبة القرض', desc:'القسط الشهري وإجمالي الفوائد',
    inputs:[{id:'p',label:'مبلغ القرض',type:'number'},{id:'r',label:'الفائدة السنوية %',type:'number'},{id:'y',label:'المدة (سنوات)',type:'number'}],
    run:v=>{const p=+v.p,n=+v.y*12,r=+v.r/1200;if(!p||!n)return '';const m=r?p*r/(1-Math.pow(1+r,-n)):p/n;
      return `القسط الشهري: ${m.toFixed(2)}\nالإجمالي: ${(m*n).toFixed(2)}\nإجمالي الفوائد: ${(m*n-p).toFixed(2)}`;} },
  { id:'bill-split', name:'تقسيم الفاتورة', desc:'نصيب كل شخص مع البقشيش',
    inputs:[{id:'t',label:'إجمالي الفاتورة',type:'number'},{id:'n',label:'عدد الأشخاص',type:'number',value:2},{id:'p',label:'البقشيش %',type:'number',value:0}],
    run:v=>{const t=+v.t*(1+(+v.p||0)/100),n=+v.n;if(!t||!n)return '';return `الإجمالي: ${t.toFixed(2)}\nنصيب كل شخص: ${(t/n).toFixed(2)}`;} },
  { id:'vat', name:'حاسبة الضريبة (القيمة المضافة)', desc:'إضافة الضريبة أو استخراجها من مبلغ شامل',
    inputs:[{id:'a',label:'المبلغ',type:'number'},{id:'r',label:'نسبة الضريبة %',type:'number',value:15},{id:'m',label:'العملية',type:'select',options:[['add','إضافة الضريبة للمبلغ'],['ext','استخراج الضريبة من مبلغ شامل']]}],
    run:v=>{if(v.a==='')return '';const a=+v.a,r=+v.r/100;if(v.m==='add')return `الضريبة: ${fmt(a*r)}\nالإجمالي: ${fmt(a*(1+r))}`;
      const b=a/(1+r);return `المبلغ قبل الضريبة: ${fmt(b)}\nالضريبة: ${fmt(a-b)}`;} },
  { id:'zakat', name:'حاسبة زكاة المال', desc:'تحقق من بلوغ النصاب واحسب 2.5%',
    inputs:[{id:'w',label:'إجمالي المال المدخر',type:'number'},{id:'g',label:'سعر غرام الذهب عيار 24 (بنفس العملة)',type:'number'}],
    run:v=>{if(v.w===''||!+v.g)return '';const n=85*+v.g,w=+v.w;
      return `النصاب (85 غرام ذهب): ${fmt(n)}\n`+(w>=n?`بلغ المال النصاب\nالزكاة الواجبة: ${fmt(w*.025)}\n(بشرط مرور سنة هجرية كاملة على المال)`:'لم يبلغ المال النصاب، فلا زكاة فيه');} },
  { id:'margin', name:'حاسبة هامش الربح', desc:'الربح ونسبة الهامش ونسبة الزيادة على التكلفة',
    inputs:[{id:'c',label:'التكلفة',type:'number'},{id:'p',label:'سعر البيع',type:'number'}],
    run:v=>{const c=+v.c,p=+v.p;if(!c||!p)return '';return `الربح: ${fmt(p-c)}\nهامش الربح: ${fmt((p-c)/p*100)}%\nنسبة الزيادة على التكلفة: ${fmt((p-c)/c*100)}%`;} },
  { id:'compound', name:'الفائدة المركبة والادخار', desc:'نمو مبلغ مع إيداع شهري اختياري',
    inputs:[{id:'p',label:'المبلغ الأولي',type:'number',value:0},{id:'m',label:'إيداع شهري',type:'number',value:0},{id:'r',label:'العائد السنوي %',type:'number'},{id:'y',label:'المدة (سنوات)',type:'number'}],
    run:v=>{const n=Math.round(+v.y*12),r=+v.r/1200;if(!n||v.r==='')return '';let b=+v.p||0;for(let i=0;i<n;i++)b=b*(1+r)+(+v.m||0);
      const d=(+v.p||0)+(+v.m||0)*n;return `الرصيد النهائي: ${fmt(b)}\nإجمالي ما أودعته: ${fmt(d)}\nالأرباح: ${fmt(b-d)}`;} },
  { id:'savings-goal', name:'هدف الادخار', desc:'كم شهراً تحتاج للوصول إلى مبلغ معين',
    inputs:[{id:'g',label:'المبلغ المستهدف',type:'number'},{id:'c',label:'المدخر حالياً',type:'number',value:0},{id:'m',label:'الادخار الشهري',type:'number'}],
    run:v=>{const g=+v.g,c=+v.c||0,m=+v.m;if(!g||!m)return '';if(c>=g)return 'وصلت للهدف بالفعل';const n=Math.ceil((g-c)/m);return `${n} شهر (${fmt(n/12,1)} سنة)`;} },
  { id:'flat-installment', name:'التقسيط بفائدة ثابتة', desc:'القسط الشهري عند الشراء بالتقسيط',
    inputs:[{id:'p',label:'سعر السلعة',type:'number'},{id:'d',label:'الدفعة الأولى',type:'number',value:0},{id:'m',label:'عدد الأشهر',type:'number'},{id:'r',label:'نسبة الربح السنوية %',type:'number'}],
    run:v=>{const l=(+v.p)-(+v.d||0),m=+v.m;if(!l||!m||v.r==='')return '';const i=l*(+v.r)/100*m/12;return `القسط الشهري: ${fmt((l+i)/m)}\nإجمالي الربح: ${fmt(i)}\nإجمالي ما ستدفعه: ${fmt(l+i+(+v.d||0))}`;} },
  { id:'roi', name:'العائد على الاستثمار', desc:'نسبة الربح والعائد السنوي',
    inputs:[{id:'c',label:'مبلغ الاستثمار',type:'number'},{id:'f',label:'القيمة النهائية',type:'number'},{id:'y',label:'المدة بالسنوات (اختياري)',type:'number'}],
    run:v=>{const c=+v.c,f=+v.f;if(!c||v.f==='')return '';return `الربح: ${fmt(f-c)}\nالعائد: ${fmt((f-c)/c*100)}%`+(+v.y>0&&f>0?`\nالعائد السنوي المركب: ${fmt((Math.pow(f/c,1/+v.y)-1)*100)}%`:'');} },
  { id:'break-even', name:'نقطة التعادل', desc:'عدد الوحدات اللازمة لتغطية التكاليف',
    inputs:[{id:'f',label:'التكاليف الثابتة',type:'number'},{id:'p',label:'سعر بيع الوحدة',type:'number'},{id:'c',label:'تكلفة الوحدة المتغيرة',type:'number'}],
    run:v=>{const f=+v.f,p=+v.p,c=+v.c;if(!f||!p)return '';if(p<=c)throw new Error('سعر البيع يجب أن يزيد عن التكلفة المتغيرة');const u=Math.ceil(f/(p-c));return `${u.toLocaleString('en')} وحدة\nالمبيعات عند التعادل: ${fmt(u*p)}`;} },
  { id:'gold-value', name:'قيمة الذهب', desc:'قيمة ذهب حسب الوزن والعيار',
    inputs:[{id:'w',label:'الوزن (غرام)',type:'number'},{id:'k',label:'العيار',type:'select',options:[['24','24'],['22','22'],['21','21'],['18','18']]},{id:'p',label:'سعر غرام عيار 24',type:'number'}],
    run:v=>{if(!+v.w||!+v.p)return '';return fmt(+v.w*(+v.k/24)*(+v.p));} },
  { id:'end-of-service', name:'مكافأة نهاية الخدمة', desc:'تقدير حسب نظام العمل السعودي (نصف شهر لأول 5 سنوات ثم شهر)',
    inputs:[{id:'y',label:'سنوات الخدمة',type:'number'},{id:'s',label:'آخر أجر شهري',type:'number'}],
    run:v=>{const y=+v.y,s=+v.s;if(!y||!s)return '';return fmt(y<=5?s/2*y:s/2*5+s*(y-5))+'\n(تقدير عام؛ تختلف المكافأة حسب سبب انتهاء العقد، فراجع نظام العمل)';} },
  {id:'salary-convert',name:'تحويل الراتب (ساعة/شهر/سنة)',desc:'الراتب بالساعة والأسبوع والشهر والسنة',inputs:[SEL('f','المبلغ الذي تعرفه',[['h','بالساعة'],['m','شهري'],['y','سنوي']]),N('x','المبلغ'),N('w','ساعات العمل أسبوعياً',40)],
    run:v=>{if(!ok(v.x,v.w)||!+v.w)return '';const y=v.f==='h'?v.x*v.w*52:v.f==='m'?v.x*12:+v.x;return `بالساعة: ${fmt(y/(v.w*52))}\nأسبوعي: ${fmt(y/52)}\nشهري: ${fmt(y/12)}\nسنوي: ${fmt(y)}`;}},
  {id:'overtime',name:'حاسبة العمل الإضافي',desc:'أجر الساعات الإضافية',inputs:[N('r','أجر الساعة'),N('h','ساعات العمل العادية'),N('o','ساعات الإضافي'),N('m','معامل الإضافي',1.5)],
    run:v=>{if(!ok(v.r,v.o))return '';const a=v.r*(+v.h||0),b=v.r*v.o*(+v.m||1.5);return `الأجر العادي: ${fmt(a)}\nأجر الإضافي: ${fmt(b)}\nالإجمالي: ${fmt(a+b)}`;}},
  {id:'salary-raise',name:'زيادة الراتب',desc:'الراتب الجديد بعد نسبة زيادة',inputs:[N('s','الراتب الحالي'),N('p','نسبة الزيادة %')],run:v=>ok(v.s,v.p)?`الراتب الجديد: ${fmt(v.s*(1+v.p/100))}\nالزيادة: ${fmt(v.s*v.p/100)}\nالزيادة السنوية: ${fmt(v.s*v.p/100*12)}`:''},
  {id:'mortgage',name:'حاسبة الرهن العقاري',desc:'القسط الشهري لتمويل عقار',inputs:[N('p','سعر العقار'),N('d','الدفعة الأولى %',20),N('r','الفائدة السنوية %'),N('y','المدة (سنوات)')],
    run:v=>{if(!ok(v.p,v.r,v.y))return '';const L=v.p*(1-(+v.d||0)/100),n=v.y*12,r=v.r/1200,m=r?L*r/(1-Math.pow(1+r,-n)):L/n;return `مبلغ التمويل: ${fmt(L)}\nالقسط الشهري: ${fmt(m)}\nإجمالي المدفوع: ${fmt(m*n)}\nإجمالي الفوائد: ${fmt(m*n-L)}`;}},
  {id:'simple-interest',name:'الفائدة البسيطة',desc:'الفائدة = المبلغ × النسبة × المدة',inputs:[N('p','المبلغ'),N('r','النسبة السنوية %'),N('y','المدة (سنوات)')],run:v=>ok(v.p,v.r,v.y)?`الفائدة: ${fmt(v.p*v.r/100*v.y)}\nالإجمالي: ${fmt(+v.p+v.p*v.r/100*v.y)}`:''},
  {id:'cagr',name:'معدل النمو السنوي المركب CAGR',desc:'من قيمة البداية والنهاية',inputs:[N('b','القيمة الأولية'),N('e','القيمة النهائية'),N('y','عدد السنوات')],run:v=>ok(v.b,v.e,v.y)&&+v.b>0&&+v.y>0?fmt((Math.pow(v.e/v.b,1/v.y)-1)*100,3)+'% سنوياً':''},
]},
{ id:'health', name:'حاسبات الصحة', tools:[
  { id:'bmi', name:'مؤشر كتلة الجسم', desc:'احسب BMI من الوزن والطول',
    inputs:[{id:'w',label:'الوزن (كجم)',type:'number'},{id:'h',label:'الطول (سم)',type:'number'}],
    run:v=>{const w=+v.w,h=+v.h/100;if(!w||!h)return '';const b=w/(h*h);
      const c=b<18.5?'نحافة':b<25?'وزن طبيعي':b<30?'وزن زائد':'سمنة';return `المؤشر: ${b.toFixed(1)}\nالتصنيف: ${c}`;} },
  { id:'bmr', name:'معدل الحرق (السعرات)', desc:'معدل الأيض الأساسي والسعرات اللازمة للثبات',
    inputs:[{id:'s',label:'الجنس',type:'select',options:[['m','ذكر'],['f','أنثى']]},{id:'a',label:'العمر',type:'number'},{id:'w',label:'الوزن (كجم)',type:'number'},{id:'h',label:'الطول (سم)',type:'number'},
      {id:'k',label:'مستوى النشاط',type:'select',options:[['1.2','خامل'],['1.375','نشاط خفيف'],['1.55','نشاط متوسط'],['1.725','نشاط عالٍ']]}],
    run:v=>{const a=+v.a,w=+v.w,h=+v.h;if(!a||!w||!h)return '';const b=10*w+6.25*h-5*a+(v.s==='m'?5:-161);
      return `معدل الأيض الأساسي: ${Math.round(b)} سعرة\nالسعرات للحفاظ على الوزن: ${Math.round(b*v.k)} سعرة`;} },

  {id:'slope',name:'الميل والمسافة بين نقطتين',desc:'ميل الخط والمعادلة ونقطة المنتصف',inputs:[N('x1','x₁'),N('y1','y₁'),N('x2','x₂'),N('y2','y₂')],

  {id:'logarithm',name:'اللوغاريتمات',desc:'لوغاريتم بأي أساس واللوغاريتم الطبيعي',inputs:[N('x','العدد'),N('b','الأساس',10)],run:v=>{if(!ok(v.x)||+v.x<=0)return '';return `log₍${v.b||10}₎ = ${fmt(Math.log(v.x)/Math.log(v.b||10),8)}\nln = ${fmt(Math.log(v.x),8)}\nlog₁₀ = ${fmt(Math.log10(v.x),8)}\nlog₂ = ${fmt(Math.log2(v.x),8)}`;}},
  {id:'volume-shapes',name:'حجم الأشكال ومساحتها السطحية',desc:'مكعب، متوازي مستطيلات، أسطوانة، كرة، مخروط',inputs:[SEL('s','الشكل',[['cube','مكعب (أ = الضلع)'],['box','متوازي مستطيلات (أ، ب، ج)'],['cyl','أسطوانة (أ = نصف القطر، ب = الارتفاع)'],['sph','كرة (أ = نصف القطر)'],['cone','مخروط (أ = نصف القطر، ب = الارتفاع)']]),N('a','أ'),N('b','ب'),N('c','ج')],
    run:v=>{const a=+v.a,b=+v.b,c=+v.c;if(!a)return '';const P=Math.PI,r={cube:[a**3,6*a*a],box:[a*b*c,2*(a*b+b*c+a*c)],cyl:[P*a*a*b,2*P*a*(a+b)],sph:[4/3*P*a**3,4*P*a*a],cone:[P*a*a*b/3,P*a*(a+Math.hypot(a,b))]}[v.s];if(r.some(x=>!x))return '';return `الحجم: ${fmt(r[0],4)}\nالمساحة السطحية: ${fmt(r[1],4)}`;}},
  {id:'probability',name:'الاحتمالات (ذات الحدين)',desc:'احتمال عدد نجاحات في محاولات متكررة',inputs:[N('p','احتمال النجاح في المحاولة (0 إلى 1)'),N('n','عدد المحاولات'),N('k','عدد النجاحات المطلوبة')],
    run:v=>{if(!ok(v.p,v.n,v.k))return '';const p=+v.p,n=Math.trunc(+v.n),k=Math.trunc(+v.k);if(p<0||p>1||n<1||n>1000||k<0||k>n)throw new Error('تحقق من القيم');const C=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r;},P=j=>C(n,j)*p**j*(1-p)**(n-j);let ge=0;for(let j=k;j<=n;j++)ge+=P(j);
      return `بالضبط ${k}: ${fmt(P(k)*100,4)}%\n${k} أو أكثر: ${fmt(ge*100,4)}%\n${k} أو أقل: ${fmt((1-ge+P(k))*100,4)}%\nالمتوقع: ${fmt(n*p,3)} نجاح`;}},
]},
{ id:'time', name:'التاريخ والوقت', tools:[

{ id:'conv', name:'التحويلات', tools:[

    run:v=>{if(v.x==='')return '';const [c1,k1]=v.a.split('|'),[c2,k2]=v.b.split('|');if(c1!==c2)throw new Error('اختر وحدتين من نفس النوع');const x=+v.x;

  {id:'wavelength',name:'الطول الموجي والتردد',desc:'λ = السرعة ÷ التردد',inputs:[N('f','التردد (هرتز)'),SEL('c','الوسط',[['299792458','ضوء/موجات كهرومغناطيسية'],['343','صوت في الهواء']])],run:v=>ok(v.f)&&+v.f?`λ = ${(v.c/v.f).toExponential(4)} متر`:''},
  {id:'reynolds',name:'رقم رينولدز',desc:'نوع الجريان: صفائحي أو مضطرب',inputs:[N('r','الكثافة (كجم/م³)'),N('v','السرعة (م/ث)'),N('d','القطر (م)'),N('m','اللزوجة (باسكال·ث)')],run:v=>{if(!ok(v.r,v.v,v.d,v.m)||!+v.m)return '';const R=v.r*v.v*v.d/v.m;return `Re = ${fmt(R,0)}\n${R<2300?'جريان صفائحي':R>4000?'جريان مضطرب':'جريان انتقالي'}`;}},
  {id:'dilution',name:'التخفيف C₁V₁ = C₂V₂',desc:'اترك حقلاً واحداً فارغاً',inputs:[N('a','C₁'),N('b','V₁'),N('c','C₂'),N('d','V₂')],run:v=>{const k=['a','b','c','d'].filter(x=>v[x]==='');if(k.length!==1)return 'اترك حقلاً واحداً فارغاً';const[a,b,c,d]=['a','b','c','d'].map(x=>+v[x]);const r={a:c*d/b,b:c*d/a,c:a*b/d,d:a*b/c}[k[0]];return `القيمة المجهولة = ${fmt(r,6)}`;}},
  {id:'molarity',name:'التركيز المولي',desc:'المولارية من الكتلة والكتلة المولية',inputs:[N('m','الكتلة (غرام)'),N('M','الكتلة المولية (غ/مول)'),N('v','الحجم (لتر)')],run:v=>ok(v.m,v.M,v.v)&&+v.M&&+v.v?`المولات: ${fmt(v.m/v.M,5)} مول\nالتركيز: ${fmt(v.m/v.M/v.v,5)} مول/لتر`:''},
  {id:'ph',name:'الرقم الهيدروجيني pH',desc:'من التركيز إلى pH أو العكس',inputs:[SEL('m','التحويل',[['c','تركيز H⁺ ← pH'],['p','pH ← تركيز H⁺']]),N('x','القيمة')],run:v=>{if(!ok(v.x))return '';if(v.m==='c'){if(+v.x<=0)throw new Error('التركيز موجب');const p=-Math.log10(v.x);return `pH = ${fmt(p,3)}\npOH = ${fmt(14-p,3)}`;}return `[H⁺] = ${(10**-v.x).toExponential(3)} مول/لتر`;}},
  {id:'sci-notation',name:'التدوين العلمي',desc:'اكتب أي رقم كبير أو صغير',inputs:[{id:'x',label:'العدد',type:'text'}],run:v=>{if(!v.x.trim())return '';const n=Number(v.x);if(isNaN(n))throw new Error('عدد غير صالح');const[m,e]=n.toExponential(6).split('e');return `${+m} × 10^${+e}\n${n.toExponential()}`;}},
  {id:'half-life',name:'التحلل ونصف العمر',desc:'الكمية المتبقية بعد مدة',inputs:[N('n','الكمية الأولية'),N('h','نصف العمر'),N('t','الزمن (بنفس وحدة نصف العمر)')],run:v=>{if(!ok(v.n,v.h,v.t)||!+v.h)return '';const f=.5**(v.t/v.h);return `المتبقي: ${fmt(v.n*f,4)}\nالنسبة: ${fmt(f*100,3)}%`;}},
  {id:'population-growth',name:'النمو السكاني/الأسي',desc:'N = N₀ × (1 + r)^t',inputs:[N('n','العدد الأولي'),N('r','معدل النمو لكل فترة %'),N('t','عدد الفترات')],run:v=>ok(v.n,v.r,v.t)?`العدد بعد ${v.t} فترة: ${fmt(v.n*(1+v.r/100)**v.t,2)}`:''},
]},
{ id:'islamic', name:'الحاسبات الشرعية', tools:[
  { id:'zakat-fitr', name:'زكاة الفطر', desc:'مقدارها للعائلة (الصاع حوالي 3 كجم)',
    inputs:[{id:'n',label:'عدد الأشخاص',type:'number'},{id:'k',label:'كجم للشخص',type:'number',value:3},{id:'p',label:'سعر الكيلو من الطعام (اختياري)',type:'number'}],
    run:v=>{const n=+v.n,k=+v.k;if(!n||!k)return '';return `الإجمالي: ${fmt(n*k)} كجم`+(+v.p?`\nقيمته: ${fmt(n*k*+v.p)}`:'');} },
  { id:'zakat-gold', name:'زكاة الذهب', desc:'بالغرامات (النصاب 85 غراماً عيار 24)',
    inputs:[{id:'g',label:'وزن الذهب (غرام عيار 24 أو ما يعادله)',type:'number'}],
    run:v=>{const g=+v.g;if(!g)return '';return g>=85?`بلغ النصاب\nالزكاة: ${fmt(g*.025,3)} غرام (2.5%)\n(بشرط مرور سنة هجرية)`:'لم يبلغ النصاب (85 غراماً)';} },
]},
{ id:'life', name:'أدوات الحياة اليومية', tools:[
  {id:'birth-year',name:'سنة الميلاد من العمر',desc:'سنة الولادة التقريبية',inputs:[N('a','العمر')],run:v=>{if(!ok(v.a))return '';const y=new Date().getFullYear()-Math.trunc(v.a);return `غالباً ${y} أو ${y-1}`;}},
  {id:'elapsed',name:'عدّاد الأشهر والأسابيع',desc:'المدة من تاريخ إلى اليوم أو منه',inputs:[{id:'d',label:'التاريخ',type:'date'}],run:v=>{if(!v.d)return '';const n=new Date();n.setHours(0,0,0,0);const d=new Date(v.d+'T00:00'),a=Math.abs(Math.round((n-d)/864e5));let m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();if(d<n?n.getDate()<d.getDate():d.getDate()<n.getDate())m+=d<n?-1:1;return `${d<n?'مضى':'متبقي'}: ${a} يوم\nأسابيع: ${Math.floor(a/7)} و ${a%7} يوم\nأشهر: ${Math.abs(m)}`;}},
  {id:'download-time',name:'وقت التنزيل',desc:'كم يستغرق تنزيل ملف',inputs:[N('s','حجم الملف'),SEL('u','الوحدة',[['1','ميغابايت'],['1024','غيغابايت'],['1048576','تيرابايت']]),N('v','سرعة الإنترنت (ميغابت/ث)')],run:v=>ok(v.s,v.v)&&+v.v?hm(v.s*v.u*8/v.v):''},
  {id:'unit-price',name:'مقارنة سعر الوحدة',desc:'أي العبوتين أوفر؟',inputs:[N('p','سعر العبوة 1'),N('q','كمية العبوة 1'),N('r','سعر العبوة 2'),N('t','كمية العبوة 2')],run:v=>{if(!ok(v.p,v.q,v.r,v.t)||!+v.q||!+v.t)return '';const a=v.p/v.q,b=v.r/v.t;return `سعر الوحدة 1: ${fmt(a,4)}\nسعر الوحدة 2: ${fmt(b,4)}\n`+(a===b?'متساويتان':`الأوفر: العبوة ${a<b?1:2} (أرخص بنسبة ${fmt(Math.abs(a-b)/Math.max(a,b)*100)}%)`);}},
  {id:'double-discount',name:'خصمان متتاليان',desc:'السعر بعد خصم على خصم',inputs:[N('p','السعر'),N('a','الخصم الأول %'),N('b','الخصم الثاني %')],run:v=>{if(!ok(v.p,v.a,v.b))return '';const f=v.p*(1-v.a/100)*(1-v.b/100);return `السعر النهائي: ${fmt(f)}\nالخصم الفعلي: ${fmt((1-f/v.p)*100)}%`;}},
  {id:'one-rep-max',name:'أقصى وزن لتكرار واحد (1RM)',desc:'تقدير من وزن وعدد تكرارات',inputs:[N('w','الوزن (كجم)'),N('r','عدد التكرارات (حتى 10)')],run:v=>ok(v.w,v.r)&&v.r>0&&v.r<37?`إبلي: ${fmt(v.w*(1+v.r/30),1)} كجم\nبريزكي: ${fmt(v.w*36/(37-v.r),1)} كجم`:''},
]},
];

/* ---------- المحرك (لا تحتاج تعديله) ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const view=$('#view');
let filter='all',q='';

function home(){
  view.innerHTML='';
  const s=el('input','search');s.placeholder='ابحث عن حاسبة…';s.value=q;view.append(s);
  const chips=el('div','chips');view.append(chips);
  [['all','الكل'],...SECTIONS.map(x=>[x.id,x.name])].forEach(([id,n])=>{
    const c=el('button','chip'+(filter===id?' on':''),n);
    c.onclick=()=>{filter=id;home();};chips.append(c);});
  const box=el('div');view.append(box);
  const draw=()=>{
    box.innerHTML='';let any=false;
    SECTIONS.filter(x=>filter==='all'||x.id===filter).forEach(sec=>{
      const list=sec.tools.filter(t=>(t.name+t.desc).toLowerCase().includes(q.toLowerCase()));
      if(!list.length)return;any=true;
      box.append(el('h2','',sec.name));
      const g=el('div','grid');box.append(g);
      list.forEach(t=>{const c=el('button','card');c.append(el('b','',t.name),el('span','',t.desc));
        c.onclick=()=>{location.hash=t.id;};g.append(c);});
    });
    if(!any)box.append(el('div','empty','لا توجد أدوات مطابقة'));
  };
  s.oninput=()=>{q=s.value;draw();};draw();
}

function dateField(){
  const w=el('div','dsel'),MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],Y=new Date().getFullYear();
  const mk=(ph,list)=>{const s=el('select'),o=el('option','',ph);o.value='';s.append(o);list.forEach(([v,n])=>{const x=el('option','',n);x.value=v;s.append(x);});return s;};
  const d=mk('اليوم',Array.from({length:31},(_,i)=>[i+1,i+1])),m=mk('الشهر',MN.map((n,i)=>[i+1,n])),y=mk('السنة',Array.from({length:Y+31-1900},(_,i)=>[Y+30-i,Y+30-i]));
  w.append(d,m,y);
  const fix=()=>{if(m.value&&y.value&&d.value){const n=new Date(+y.value,+m.value,0).getDate();if(+d.value>n)d.value=n;}};
  m.addEventListener('change',fix);y.addEventListener('change',fix);
  Object.defineProperty(w,'value',{get:()=>(d.value&&m.value&&y.value)?`${y.value}-${String(m.value).padStart(2,'0')}-${String(d.value).padStart(2,'0')}`:'',set:x=>{const p=(x||'').split('-');y.value=p[0]||'';m.value=p[1]?+p[1]:'';d.value=p[2]?+p[2]:'';}});
  return w;
}

function openTool(t){
  view.innerHTML='';
  const back=el('button','back','→ كل الأدوات');back.onclick=()=>{location.hash='';};
  const p=el('div','panel');p.append(el('h3','',t.name),el('p','',t.desc));
  view.append(back,p);
  if(t.render){t.render(p);return;}
  const f={};
  t.inputs.forEach(i=>{
    p.append(el('label','',i.label));
    let e;
    if(i.type==='textarea')e=el('textarea');
    else if(i.type==='select'){e=el('select');i.options.forEach(([v,n])=>{const o=el('option','',n);o.value=v;e.append(o);});}
    else if(i.type==='date')e=dateField();else{e=el('input');e.type=i.type;}
    if(i.value!=null)e.value=i.value;
    f[i.id]=e;p.append(e);
  });
  const out=el('div','out');const cp=el('button','copy','نسخ النتيجة');
  const run=()=>{
    const v={};for(const k in f)v[k]=f[k].value;
    try{Promise.resolve(t.run(v)).then(r=>{out.textContent=r;out.className='out';},e=>{out.textContent='خطأ: '+e.message;out.className='out err';});}
    catch(e){out.textContent='خطأ: '+e.message;out.className='out err';}
  };
  if(t.action){const b=el('button','go',t.action);b.onclick=run;p.append(b);}
  else for(const k in f){f[k].addEventListener('input',run);f[k].addEventListener('change',run);}
  p.append(out,cp);
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);cp.textContent='تم النسخ ✓';}
    catch(e){cp.textContent='تعذّر النسخ';}setTimeout(()=>cp.textContent='نسخ النتيجة',1500);};
  if(t.action)run();
}

function route(){
  const id=location.hash.slice(1);
  const t=SECTIONS.flatMap(s=>s.tools).find(x=>x.id===id);
  t?openTool(t):home();window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
